<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="GOLJU MART Admin Login">

    <meta name="theme-color"
          content="#050505">

    <title>GOLJU MART | Admin Login</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, Helvetica, sans-serif;

            background:
                radial-gradient(
                    circle at top right,
                    #4a3a16 0%,
                    transparent 35%
                ),
                linear-gradient(
                    135deg,
                    #050505,
                    #151515
                );

            color: #ffffff;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 430px;
        }

        .brand {
            text-align: center;
            margin-bottom: 25px;
        }

        .brand h1 {
            font-size: 34px;
            letter-spacing: 2px;
            font-weight: 900;
        }

        .brand h1 span {
            color: #D4AF37;
        }

        .brand p {
            margin-top: 8px;
            color: #999999;
            font-size: 14px;
        }

        .login-card {
            background: #121212;
            border: 1px solid #302817;
            border-radius: 20px;
            padding: 35px 30px;

            box-shadow:
                0 20px 60px rgba(0,0,0,.5);
        }

        .admin-icon {
            width: 70px;
            height: 70px;

            margin: 0 auto 20px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: #1d1d1d;
            border: 1px solid #D4AF37;

            font-size: 32px;
        }

        .login-card h2 {
            text-align: center;
            font-size: 28px;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #888888;
            font-size: 14px;
            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: bold;
        }

        .form-group input {
            width: 100%;
            padding: 14px 15px;

            background: #0b0b0b;
            color: #ffffff;

            border: 1px solid #302817;
            border-radius: 9px;

            outline: none;
            font-size: 15px;
        }

        .form-group input:focus {
            border-color: #D4AF37;
        }

        .login-btn {
            width: 100%;
            padding: 14px;

            border: none;
            border-radius: 9px;

            background:
                linear-gradient(
                    135deg,
                    #D4AF37,
                    #F4D878
                );

            color: #050505;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        .login-btn:hover {
            opacity: .9;
        }

        .login-btn:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        .forgot-password {
            display: block;

            margin-top: 16px;

            text-align: center;

            color: #D4AF37;

            font-size: 14px;

            text-decoration: none;

            cursor: pointer;
        }

        .forgot-password:hover {
            text-decoration: underline;
        }

        .message {
            display: none;

            margin-top: 18px;

            padding: 12px;

            border-radius: 8px;

            font-size: 14px;

            text-align: center;
        }

        .message.error {
            display: block;

            background: #2a1010;
            border: 1px solid #702020;

            color: #ffb0b0;
        }

        .message.success {
            display: block;

            background: #102a18;
            border: 1px solid #205f32;

            color: #a8f5bd;
        }

        .back-link {
            display: block;

            text-align: center;

            margin-top: 22px;

            color: #999999;

            font-size: 14px;

            text-decoration: none;
        }

        .back-link:hover {
            color: #D4AF37;
        }

        .security-note {
            text-align: center;

            margin-top: 22px;

            color: #666666;

            font-size: 12px;
        }

        @media(max-width:500px) {

            .login-card {
                padding: 30px 20px;
            }

            .brand h1 {
                font-size: 28px;
            }

        }

    </style>

</head>


<body>


<div class="login-container">


    <!-- ================= BRAND ================= -->

    <div class="brand">

        <h1>
            GOLJU<span>MART</span>
        </h1>

        <p>
            Admin Management System
        </p>

    </div>


    <!-- ================= LOGIN CARD ================= -->

    <div class="login-card">


        <div class="admin-icon">
            🔐
        </div>


        <h2>
            Admin Login
        </h2>


        <p class="subtitle">
            Login to manage GOLJU MART
        </p>


        <!-- ================= LOGIN FORM ================= -->

        <form id="adminLoginForm">


            <div class="form-group">

                <label for="adminEmail">
                    Email Address
                </label>

                <input
                    type="email"
                    id="adminEmail"
                    placeholder="Enter admin email"
                    autocomplete="email"
                    required>

            </div>


            <div class="form-group">

                <label for="adminPassword">
                    Password
                </label>

                <input
                    type="password"
                    id="adminPassword"
                    placeholder="Enter password"
                    autocomplete="current-password"
                    required>

            </div>


            <button
                type="submit"
                id="loginButton"
                class="login-btn">

                LOGIN TO ADMIN PANEL

            </button>


        </form>


        <!-- ================= FORGOT PASSWORD ================= -->

        <a
            href="#"
            id="forgotPassword"
            class="forgot-password">

            Forgot Password?

        </a>


        <!-- ================= MESSAGE ================= -->

        <div
            id="loginMessage"
            class="message">
        </div>


        <!-- ================= BACK TO WEBSITE ================= -->

        <a
            href="index.html"
            class="back-link">

            ← Back to GOLJU MART

        </a>


    </div>


    <div class="security-note">

        🔒 Secure Admin Authentication

    </div>


</div>


<!-- =========================================================
     FIREBASE AUTHENTICATION
========================================================= -->

<script type="module">

    import {
        initializeApp
    } from
    "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


    import {
        getAuth,
        signInWithEmailAndPassword,
        sendPasswordResetEmail,
        onAuthStateChanged
    } from
    "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


    /* ================= FIREBASE CONFIG ================= */

    const firebaseConfig = {

        apiKey:
        "AIzaSyCSfbhLrbXAnLAmZV7Hus2Mdy3B_kYiVdg",

        authDomain:
        "golju-mart.firebaseapp.com",

        projectId:
        "golju-mart",

        storageBucket:
        "golju-mart.firebasestorage.app",

        messagingSenderId:
        "61188266398",

        appId:
        "1:61188266398:web:e03c2139256c57be365e8f",

        measurementId:
        "G-R80MJTQ5M9"

    };


    /* ================= INITIALIZE FIREBASE ================= */

    const app =
        initializeApp(firebaseConfig);


    const auth =
        getAuth(app);


    /* ================= ADMIN EMAIL ================= */

    const ADMIN_EMAIL =
        "negiajay110@gmail.com";


    /* ================= ELEMENTS ================= */

    const form =
        document.getElementById(
            "adminLoginForm"
        );


    const emailInput =
        document.getElementById(
            "adminEmail"
        );


    const passwordInput =
        document.getElementById(
            "adminPassword"
        );


    const loginButton =
        document.getElementById(
            "loginButton"
        );


    const forgotPassword =
        document.getElementById(
            "forgotPassword"
        );


    const message =
        document.getElementById(
            "loginMessage"
        );


    /* ================= MESSAGE FUNCTION ================= */

    function showMessage(
        text,
        type
    ) {

        message.textContent =
            text;

        message.className =
            "message " + type;

    }


    /* ================= ADMIN LOGIN ================= */

    form.addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const email =
                emailInput.value
                .trim()
                .toLowerCase();


            const password =
                passwordInput.value;


            if (!email || !password) {

                showMessage(
                    "Please enter email and password.",
                    "error"
                );

                return;
            }


            /* ADMIN EMAIL CHECK */

            if (email !== ADMIN_EMAIL) {

                showMessage(
                    "Access denied. This account is not an authorized GOLJU MART admin.",
                    "error"
                );

                return;
            }


            loginButton.disabled =
                true;

            loginButton.textContent =
                "LOGGING IN...";


            try {

                await signInWithEmailAndPassword(
                    auth,
                    email,
                    password
                );


                showMessage(
                    "Login successful. Opening Admin Panel...",
                    "success"
                );


                /*
                 * Dashboard अगला step में बनाएँगे.
                 */

                setTimeout(
                    function() {

                        window.location.href =
                            "admin-dashboard.html";

                    },
                    1000
                );


            }

            catch(error) {

                console.error(
                    "Admin Login Error:",
                    error
                );


                let errorMessage =
                    "Login failed. Please check your email and password.";


                if (
                    error.code ===
                    "auth/invalid-credential"
                ) {

                    errorMessage =
                        "Incorrect email or password.";

                }

                else if (
                    error.code ===
                    "auth/user-not-found"
                ) {

                    errorMessage =
                        "Admin account not found.";

                }

                else if (
                    error.code ===
                    "auth/wrong-password"
                ) {

                    errorMessage =
                        "Incorrect password.";

                }

                else if (
                    error.code ===
                    "auth/too-many-requests"
                ) {

                    errorMessage =
                        "Too many login attempts. Please try again later.";

                }


                showMessage(
                    errorMessage,
                    "error"
                );


                loginButton.disabled =
                    false;

                loginButton.textContent =
                    "LOGIN TO ADMIN PANEL";

            }

        }
    );


    /* =====================================================
       FORGOT PASSWORD
    ===================================================== */

    forgotPassword.addEventListener(
        "click",
        async function(event) {

            event.preventDefault();


            const email =
                emailInput.value
                .trim()
                .toLowerCase();


            /* EMAIL CHECK */

            if (!email) {

                showMessage(
                    "Please enter your admin email first.",
                    "error"
                );

                emailInput.focus();

                return;
            }


            /* ADMIN EMAIL CHECK */

            if (email !== ADMIN_EMAIL) {

                showMessage(
                    "Password reset is available only for the authorized admin email.",
                    "error"
                );

                return;
            }


            forgotPassword.textContent =
                "Sending reset email...";


            try {

                await sendPasswordResetEmail(
                    auth,
                    email
                );


                showMessage(
                    "Password reset email sent. Please check your Gmail Inbox, Spam and Promotions folders.",
                    "success"
                );


                forgotPassword.textContent =
                    "Reset Email Sent ✓";


            }

            catch(error) {

                console.error(
                    "Password Reset Error:",
                    error
                );


                let errorMessage =
                    "Unable to send password reset email.";


                if (
                    error.code ===
                    "auth/user-not-found"
                ) {

                    errorMessage =
                        "No admin account exists with this email.";

                }

                else if (
                    error.code ===
                    "auth/invalid-email"
                ) {

                    errorMessage =
                        "Please enter a valid email address.";

                }

                else if (
                    error.code ===
                    "auth/too-many-requests"
                ) {

                    errorMessage =
                        "Too many requests. Please wait and try again.";

                }


                showMessage(
                    errorMessage,
                    "error"
                );


                forgotPassword.textContent =
                    "Forgot Password?";

            }

        }
    );


    /* ================= AUTH STATE ================= */

    onAuthStateChanged(
        auth,
        function(user) {

            if (
                user &&
                user.email === ADMIN_EMAIL
            ) {

                console.log(
                    "Admin authenticated:",
                    user.email
                );

            }

        }
    );

</script>


</body>

</html>
